<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="utf-8" />
        <script src="sdpi-components.js"></script>
		<style>
			.normal {
				color: #d8d8d8;
				font-family: "Segoe UI",Arial,Roboto,Helvetica sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
			}
		</style>
    </head>
    <body>
        <sdpi-item label="IP">
            <sdpi-textfield setting="ip" required></sdpi-textfield>
        </sdpi-item>

        <sdpi-item label="Port">
            <sdpi-textfield setting="port" pattern="^[0-9]+$" required></sdpi-checkbox>
        </sdpi-item>

        <sdpi-item label="Message">
			<sdpi-textfield maxlength=150 setting="message" required></sdpi-textfield>
		</sdpi-item>

		<p class="normal">You can find information on variables on the <a class="normal" target="_blank" href="https://mosadie.link/SCwiki">GitHub Page</a>.</p>
    </body>
</html>
